<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hall of Fame - Merch List V2</title>
    <link rel="stylesheet" href="./styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Background Elements -->
    <div class="background-elements">
      <div class="floating-shape shape-1"></div>
      <div class="floating-shape shape-2"></div>
      <div class="floating-shape shape-3"></div>
      <div class="gradient-overlay"></div>
    </div>

    <!-- Header Section -->
    <header class="hero-header">
      <div class="header-content">
        <div class="logo-container">
          <div class="logo-circle">
            <span class="logo-text">HOF</span>
          </div>
        </div>
        <h1 class="main-title">
          <span class="title-line">HALL OF FAME</span>
          <span class="subtitle-line">Merch List V2</span>
        </h1>
        <div class="header-decoration">
          <div class="decoration-line"></div>
          <div class="decoration-dot"></div>
          <div class="decoration-line"></div>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Artistic Motif -->
      <div class="artistic-motif">
        <div class="motif-image image-1" data-tilt>
          <div class="image-wrapper">
            <img
              src="https://res.cloudinary.com/dilkydngl/image/upload/v1752076208/WhatsApp_Image_2025-07-09_at_07.40.11_2_hlmv49.jpg"
              alt="Artistic motif 1"
            />
            <div class="image-overlay"></div>
          </div>
        </div>
        <div class="motif-image image-2" data-tilt>
          <div class="image-wrapper">
            <img
              src="https://res.cloudinary.com/dilkydngl/image/upload/v1752076208/WhatsApp_Image_2025-07-09_at_07.40.11_1_jmvwpc.jpg"
              alt="Artistic motif 2"
            />
            <div class="image-overlay"></div>
          </div>
        </div>
        <div class="motif-image image-3" data-tilt>
          <div class="image-wrapper">
            <img
              src="https://res.cloudinary.com/dilkydngl/image/upload/v1752076209/WhatsApp_Image_2025-07-09_at_07.40.11_lp1s1e.jpg"
              alt="Artistic motif 3"
            />
            <div class="image-overlay"></div>
          </div>
        </div>
        <div class="motif-image image-4" data-tilt>
          <div class="image-wrapper">
            <img
              src="https://res.cloudinary.com/dilkydngl/image/upload/v1752076208/WhatsApp_Image_2025-07-09_at_07.40.10_xnm1nx.jpg"
              alt="Artistic motif 4"
            />
            <div class="image-overlay"></div>
          </div>
        </div>
      </div>

      <!-- Merch List Section -->
      <section class="merch-list-section">
        <div class="merch-container">
          <div class="merch-card">
            <div class="card-header">
              <h2 class="card-title">Exclusive Collection</h2>
              <div class="card-badge">New</div>
            </div>
            <div class="card-content">
              <div class="merch-image-container">
                <img src="./T&D.png" alt="Merch List" class="merch-image" />
                <div class="image-glow"></div>
              </div>
              <div class="card-actions">
                <button class="action-btn primary" onclick="viewCollection()">
                  View Collection
                </button>
                <button class="action-btn secondary" onclick="downloadMerch()">
                  Download
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Collection Modal -->
    <div id="collectionModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title">Hall of Fame Collection</h2>
          <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
          <div class="collection-grid">
            <div class="collection-item">
              <img src="./T&D.png" alt="Merch Item 1" />
              <div class="item-info">
                <h3>Classic Tee</h3>
                <p>Premium cotton blend</p>
                <span class="price">$29.99</span>
              </div>
            </div>
            <div class="collection-item">
              <img
                src="https://res.cloudinary.com/dilkydngl/image/upload/v1752076208/WhatsApp_Image_2025-07-09_at_07.40.11_2_hlmv49.jpg"
                alt="Merch Item 2"
              />
              <div class="item-info">
                <h3>Limited Hoodie</h3>
                <p>Exclusive design</p>
                <span class="price">$59.99</span>
              </div>
            </div>
            <div class="collection-item">
              <img
                src="https://res.cloudinary.com/dilkydngl/image/upload/v1752076208/WhatsApp_Image_2025-07-09_at_07.40.11_1_jmvwpc.jpg"
                alt="Merch Item 3"
              />
              <div class="item-info">
                <h3>Signature Cap</h3>
                <p>Embroidered logo</p>
                <span class="price">$24.99</span>
              </div>
            </div>
            <div class="collection-item">
              <img
                src="https://res.cloudinary.com/dilkydngl/image/upload/v1752076209/WhatsApp_Image_2025-07-09_at_07.40.11_lp1s1e.jpg"
                alt="Merch Item 4"
              />
              <div class="item-info">
                <h3>Collector's Print</h3>
                <p>Limited edition</p>
                <span class="price">$39.99</span>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="modal-btn secondary" onclick="closeModal()">
            Close
          </button>
          <button class="modal-btn primary" onclick="shopNow()">
            Shop Now
          </button>
        </div>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="floating-nav">
      <div class="nav-item active" onclick="setActiveNav(this)">
        <span class="nav-icon">🏆</span>
        <span class="nav-label">Hall of Fame</span>
      </div>
      <div class="nav-item" onclick="setActiveNav(this)">
        <span class="nav-icon">🛍️</span>
        <span class="nav-label">Merch</span>
      </div>
      <div class="nav-item" onclick="setActiveNav(this)">
        <span class="nav-icon">⭐</span>
        <span class="nav-label">Featured</span>
      </div>
    </nav>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
      <div class="toast-content">
        <span class="toast-message"></span>
        <button class="toast-close" onclick="hideToast()">&times;</button>
      </div>
    </div>

    <script>
      // Modal functionality
      function viewCollection() {
        const modal = document.getElementById("collectionModal");
        modal.style.display = "flex";
        document.body.style.overflow = "hidden";

        // Add entrance animation
        setTimeout(() => {
          modal.classList.add("modal-active");
        }, 10);
      }

      function closeModal() {
        const modal = document.getElementById("collectionModal");
        modal.classList.remove("modal-active");

        setTimeout(() => {
          modal.style.display = "none";
          document.body.style.overflow = "auto";
        }, 300);
      }

      // Download functionality
      function downloadMerch() {
        // Create a temporary link to download the image
        const link = document.createElement("a");
        link.href = "./T&D.png";
        link.download = "Hall-of-Fame-Merch-List.png";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        showToast("Merch list downloaded successfully! 🎉");
      }

      // Shop now functionality
      function shopNow() {
        showToast("Redirecting to shop... 🛍️");
        // You can replace this with your actual shop URL
        setTimeout(() => {
          window.open("https://your-shop-url.com", "_blank");
        }, 1500);
      }

      // Navigation functionality
      function setActiveNav(element) {
        // Remove active class from all nav items
        document.querySelectorAll(".nav-item").forEach((item) => {
          item.classList.remove("active");
        });

        // Add active class to clicked item
        element.classList.add("active");

        // Show different content based on nav item
        const label = element.querySelector(".nav-label").textContent;
        showToast(`Navigating to ${label}... 🚀`);
      }

      // Toast notification system
      function showToast(message) {
        const toast = document.getElementById("toast");
        const toastMessage = toast.querySelector(".toast-message");

        toastMessage.textContent = message;
        toast.classList.add("toast-show");

        // Auto hide after 3 seconds
        setTimeout(() => {
          hideToast();
        }, 3000);
      }

      function hideToast() {
        const toast = document.getElementById("toast");
        toast.classList.remove("toast-show");
      }

      // Close modal when clicking outside
      window.onclick = function (event) {
        const modal = document.getElementById("collectionModal");
        if (event.target === modal) {
          closeModal();
        }
      };

      // Close modal with Escape key
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          closeModal();
        }
      });

      // Add tilt effect to motif images
      document.querySelectorAll("[data-tilt]").forEach((element) => {
        element.addEventListener("mousemove", function (e) {
          const rect = this.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;

          const centerX = rect.width / 2;
          const centerY = rect.height / 2;

          const rotateX = (y - centerY) / 10;
          const rotateY = (centerX - x) / 10;

          this.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.05, 1.05, 1.05)`;
        });

        element.addEventListener("mouseleave", function () {
          this.style.transform =
            "perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)";
        });
      });
    </script>
  </body>
</html>
